<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>U DINK Events</title><meta name="theme-color" content="#060707"><style>:root{--bg:#060707;--panel:#0d1010;--line:#262b29;--text:#f7f7f4;--muted:#949b96;--lime:#d9ff18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:30;height:66px;background:rgba(5,6,6,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:34px;height:34px;border:6px solid #fff;border-top:0;border-radius:0 0 20px 20px;position:relative}.mark:after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--lime);left:50%;top:13px;transform:translate(-50%,-50%)}.brand small{display:block;font-size:8px;letter-spacing:.28em;color:#bcc2bd;margin-top:3px}.hero{height:300px;margin:12px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(0deg,rgba(0,0,0,.74),rgba(0,0,0,.08)),url('https://images.unsplash.com/photo-1761644563005-87071f6485a6?auto=format&fit=crop&w=1400&q=84') center/cover}.heroCopy{position:absolute;left:18px;right:18px;bottom:18px}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--lime);font-weight:900;text-transform:uppercase}.hero h1{margin:8px 0 7px;font-size:52px;line-height:.82;letter-spacing:-.06em;font-style:italic;text-transform:uppercase}.hero p{margin:0;color:#d0d4d1;font-size:13px;line-height:1.4}.tools{position:sticky;top:66px;z-index:20;background:linear-gradient(180deg,var(--bg) 82%,rgba(6,7,7,0));padding:10px 12px 14px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;border:1px solid #363c39;background:#0d100f;color:#d0d4d1;padding:10px 13px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase}.chip.active{background:var(--lime);border-color:var(--lime);color:#050505}.dateBtn{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #373d3a;background:#0d100f;color:#fff;border-radius:14px;padding:13px 14px;text-align:left}.dateBtn b{display:block;font-size:14px}.dateBtn small{display:block;color:var(--muted);margin-top:3px}.dateBtn span:last-child{color:var(--lime);font-size:12px;font-weight:900}.search{margin-top:8px;height:44px;border:1px solid #353a38;background:#0d100f;border-radius:14px;display:flex;align-items:center;padding:0 13px;gap:8px}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff}.wrap{padding:0 12px 30px}.titleRow{display:flex;justify-content:space-between;align-items:end;margin:6px 0 12px}.titleRow h2{font-size:19px;margin:0;text-transform:uppercase}.titleRow span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}.visual{height:250px;position:relative;background-size:cover;background-position:center}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent 62%)}.tag{position:absolute;z-index:2;left:14px;top:14px;background:var(--lime);color:#050505;padding:7px 9px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.08em}.name{position:absolute;z-index:2;left:16px;right:16px;bottom:15px;font-size:29px;font-style:italic;font-weight:950;text-transform:uppercase;line-height:.95}.name i{font-style:normal;color:var(--lime)}.body{padding:14px}.meta{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:#c3c7c4}.desc{font-size:13px;line-height:1.45;color:#8f9691;margin:10px 0 13px}.join{width:100%;border:0;border-radius:10px;background:var(--lime);color:#050505;padding:14px;font-weight:900;text-transform:uppercase}.empty{display:none;padding:36px;text-align:center;color:var(--muted);border:1px dashed #39403c;border-radius:16px}.sheetMask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;opacity:0;pointer-events:none;transition:.2s}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:#0b0d0c;border-top:1px solid #343a37;border-radius:22px 22px 0 0;transform:translateY(105%);transition:.25s;max-height:84vh;overflow:auto}.sheet.open{transform:translateY(0)}.sheetMask.open{opacity:1;pointer-events:auto}.handle{width:44px;height:5px;background:#4b524e;border-radius:9px;margin:10px auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 12px;border-bottom:1px solid #202423}.sheetHead h3{margin:0;font-size:18px;text-transform:uppercase}.close{border:1px solid #343a37;background:#111;color:#fff;border-radius:999px;padding:8px 12px}.cal{padding:16px 18px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow div{text-align:center;font-size:9px;color:#767e79}.day{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:#ddd;position:relative}.day.has:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:var(--lime);left:50%;bottom:4px;transform:translateX(-50%)}.day.sel{background:var(--lime);color:#050505;font-weight:900}.quick{display:flex;gap:8px;margin-top:14px}.quick button{flex:1;padding:12px;border-radius:11px;border:1px solid #353a38;background:#101312;color:#fff;font-weight:800}.quick .all{background:var(--lime);border-color:var(--lime);color:#050505}.agenda{padding:0 18px 18px}.agenda h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:5px 0 8px}.agendaItem{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px solid #222624}.agendaItem b{font-size:12px}.agendaItem span{font-size:10px;color:var(--muted)}@media(min-width:900px){header{height:74px;padding:0 28px}.hero{height:420px;margin:24px auto;max-width:1460px}.heroCopy{left:42px;bottom:36px;max-width:560px}.hero h1{font-size:90px}.hero p{font-size:15px}.tools{position:relative;top:0;max-width:1460px;margin:auto;padding:0 24px 18px}.chips{overflow:visible;flex-wrap:wrap}.dateBtn{display:none}.search{max-width:340px}.wrap{max-width:1460px;margin:auto;padding:0 24px 50px}.grid{grid-template-columns:repeat(2,1fr)}.sheetMask,.sheet{display:none}}</style></head><body><header><div class="brand"><span class="mark"></span><span>U DINK<small>PLAY · WEAR · DINK</small></span></div></header><section class="hero"><div class="heroCopy"><div class="eyebrow">U DINK CLUB · Bangkok</div><h1>EVENTS<span style="color:var(--lime)">/</span></h1><p>Open play, social sessions, challenge courts and community nights.</p></div></section><section class="tools"><div class="chips"><button class="chip active" data-f="all">All</button><button class="chip" data-f="open">Open Play</button><button class="chip" data-f="social">Social</button><button class="chip" data-f="challenge">Challenge</button><button class="chip" data-f="newbie">Newbie</button><button class="chip" data-f="drive">U DINK I DRIVE</button></div><button class="dateBtn" onclick="openCal()"><span><b id="dateTitle">All Dates</b><small id="dateSub">Tap to choose a date</small></span><span>Choose Date →</span></button><div class="search">⌕ <input id="q" placeholder="Search events"></div></section><main class="wrap"><div class="titleRow"><h2>Upcoming Events</h2><span id="count"></span></div><div class="grid" id="grid"></div><div class="empty" id="empty">No events match this filter.</div></main><div class="sheetMask" id="mask" onclick="closeCal()"></div><section class="sheet" id="sheet"><div class="handle"></div><div class="sheetHead"><h3>Select Date</h3><button class="close" onclick="closeCal()">Close</button></div><div class="cal"><div class="month"><b>SEP 2026</b><small style="color:var(--muted)">Tap a date</small></div><div class="dow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div><div class="days" id="days"></div><div class="quick"><button class="all" onclick="clearDate();closeCal()">View All</button><button onclick="nextEvent()">Next Event</button></div></div><div class="agenda"><h4>Upcoming</h4><div id="agenda"></div></div></section><script>const imgs={a:'https://images.unsplash.com/photo-1761644563005-87071f6485a6?auto=format&fit=crop&w=1400&q=82',b:'https://images.unsplash.com/photo-1756477558468-b3e485757470?auto=format&fit=crop&w=1400&q=82',c:'https://images.unsplash.com/photo-1778180883969-073d6361fea3?auto=format&fit=crop&w=1400&q=82'};const ev=[{t:'open',tag:'OPEN PLAY',name:'Sunday Social Open Play',d:13,time:'3:00 PM – 5:00 PM',img:'a',desc:'Friendly mixed-level open play with easy court rotations and good community energy.'},{t:'drive',tag:'U DINK I DRIVE',name:'Challenge Court Night',d:16,time:'7:30 PM – 9:30 PM',img:'b',desc:'Faster games for players who want more pressure, progress and competitive matchups.'},{t:'social',tag:'SOCIAL',name:'U DINK I DRINK',d:18,time:'7:00 PM – 9:00 PM',img:'c',desc:'Pickleball first, good vibes after. A relaxed social session built around the community.'},{t:'newbie',tag:'NEWBIE',name:"Women's Newbie Social",d:20,time:'10:00 AM – 12:00 PM',img:'a',desc:'A welcoming session for newer players with light guidance and zero pressure.'},{t:'challenge',tag:'CHALLENGE',name:'Mix & Match Court',d:23,time:'6:00 PM – 8:00 PM',img:'b',desc:'Dynamic pairings, quick rotations and competitive-but-friendly games.'},{t:'open',tag:'OPEN PLAY',name:'Weekend Community Dinks',d:27,time:'3:00 PM – 5:00 PM',img:'c',desc:'A weekend session for more games, more people and better vibes.'}];let f='all',date=null;const grid=document.getElementById('grid'),q=document.getElementById('q'),empty=document.getElementById('empty');function render(){const s=q.value.toLowerCase();const list=ev.filter(e=>(f==='all'||e.t===f)&&(!date||e.d===date)&&(!s||e.name.toLowerCase().includes(s)||e.tag.toLowerCase().includes(s)));grid.innerHTML=list.map(e=>`<article class="card"><div class="visual" style="background-image:url('${imgs[e.img]}')"><span class="tag">${e.tag}</span><div class="name">${e.name}<i>/</i></div></div><div class="body"><div class="meta"><span>SEP ${e.d}</span><span>◷ ${e.time}</span><span>⌖ Bangkok</span></div><div class="desc">${e.desc}</div><button class="join">Join Event →</button></div></article>`).join('');empty.style.display=list.length?'none':'block';document.getElementById('count').textContent=list.length+' events';document.getElementById('dateTitle').textContent=date?'Sep '+date:'All Dates';document.getElementById('dateSub').textContent=date?list.length+' event(s) on this date':'Tap to choose a date';document.querySelectorAll('.day').forEach(x=>x.classList.toggle('sel',Number(x.dataset.d)===date));agenda()}document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');f=b.dataset.f;render()});q.oninput=render;function build(){const days=document.getElementById('days'),has=ev.map(e=>e.d);let h='<button class="day" disabled></button><button class="day" disabled></button>';for(let d=1;d<=30;d++)h+=`<button class="day ${has.includes(d)?'has':''}" data-d="${d}" onclick="pick(${d})">${d}</button>`;days.innerHTML=h}function pick(d){date=d;render();closeCal()}function clearDate(){date=null;render()}function nextEvent(){date=ev.slice().sort((a,b)=>a.d-b.d)[0].d;render();closeCal()}function agenda(){document.getElementById('agenda').innerHTML=ev.slice(0,4).map(e=>`<div class="agendaItem"><span>SEP ${e.d}</span><b>${e.name}</b></div>`).join('')}function openCal(){document.getElementById('sheet').classList.add('open');document.getElementById('mask').classList.add('open');document.body.style.overflow='hidden'}function closeCal(){document.getElementById('sheet').classList.remove('open');document.getElementById('mask').classList.remove('open');document.body.style.overflow=''}build();render();</script></body></html>
